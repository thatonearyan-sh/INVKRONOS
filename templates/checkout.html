<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRONOS — Intelligent Privacy Architecture for Telegram (OPTION1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-canvas: #faf9f5;
      --bg-canvas-subtle: #f3f1ea;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #ffffff;
      
      --bg-dark: #141413;
      --bg-dark-surface: #191918;
      --bg-dark-border: rgba(255, 255, 255, 0.12);
      
      --border-hairline: #e8e6dc;
      --border-strong: #d0cebf;
      
      --text-main: #141413;
      --text-muted: #5e5d59;
      --text-subtle: #8a8880;
      
      --text-dark-main: #faf9f5;
      --text-dark-muted: #a3a199;
      --text-dark-subtle: #75746e;
      
      --accent-clay: #d97757;
      --accent-clay-hover: #c46545;
      --accent-clay-subtle: rgba(217, 119, 87, 0.12);
      --accent-olive: #788c5d;
      --accent-olive-subtle: rgba(120, 140, 93, 0.14);
      --accent-cyan: #4dd0e1;
      
      --font-serif: 'Newsreader', Georgia, Cambria, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
      
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 9999px;
      
      --container-max: 1220px;
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; -webkit-font-smoothing: antialiased; }
    
    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
    }

    svg.icon {
      width: 16px;
      height: 16px;
      vertical-align: -2px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 28px;
    }

    /* NAVIGATION BAR */
    .site-nav-wrap {
      position: sticky;
      top: 0;
      z-index: 900;
      background: rgba(250, 249, 245, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-hairline);
    }
    .site-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    /* BRANDMARK STYLING (UN-COPIABLE VECTOR TYPOGRAPHY) */
    /* BRANDMARK STYLING: OPTION 1 (ROLLING & EATING CLAY O) */
    .brand-mark-interactive {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      cursor: pointer;
    }
    .brand-mark-interactive span.dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-clay);
      display: inline-block;
      margin-right: 10px;
    }
    .brand-stage {
      display: inline-block;
      overflow: visible;
      transition: max-width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .brand-svg-mark {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      pointer-events: none;
      overflow: visible;
      vertical-align: middle;
      display: block;
    }
    .svg-glyph-fixed {
      font-family: var(--font-sans);
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: 0.12em;
      fill: var(--text-main);
    }
    .svg-glyph-eaten {
      font-family: var(--font-sans);
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: 0.12em;
      fill: var(--text-main);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }


    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .nav-links a {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .nav-links a:hover {
      color: var(--text-main);
    }
    .nav-support-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
    }
    .nav-support-badge .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-olive);
      box-shadow: 0 0 0 3px var(--accent-olive-subtle);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .btn-nav-cta {
      background: var(--text-main);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: var(--radius-md);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      border: 1px solid var(--text-main);
    }
    .btn-nav-cta:hover {
      background: #000000;
      transform: translateY(-1px);
    }

    /* HERO SECTION */
    .hero-wrap {
      padding: 96px 0 72px;
      border-bottom: 1px solid var(--border-hairline);
    }
    .hero-category-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-clay);
      background: var(--accent-clay-subtle);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      margin-bottom: 28px;
    }
    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(2.75rem, 5.5vw, 4.5rem);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.025em;
      color: var(--text-main);
      max-width: 980px;
      margin-bottom: 28px;
    }
    .hero-title em {
      font-style: italic;
      color: var(--text-main);
    }
    .hero-lead {
      font-size: clamp(1.125rem, 2vw, 1.25rem);
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 740px;
      margin-bottom: 40px;
    }
    .hero-cta-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin-bottom: 56px;
    }
    .btn-primary-clay {
      background: var(--accent-clay);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      border: 1px solid var(--accent-clay);
    }
    .btn-primary-clay:hover {
      background: var(--accent-clay-hover);
      transform: translateY(-1px);
    }
    .btn-outline-minimal {
      background: transparent;
      color: var(--text-main);
      font-size: 14.5px;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border-strong);
      transition: var(--transition);
    }
    .btn-outline-minimal:hover {
      border-color: var(--text-main);
      background: #ffffff;
    }

    /* Telemetry Metric Strip */
    .metric-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border-hairline);
      padding-top: 36px;
    }
    .metric-col {
      padding: 0 20px 0 0;
      border-right: 1px solid var(--border-hairline);
    }
    .metric-col:last-child {
      border-right: none;
      padding-right: 0;
    }
    .metric-num {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .metric-label {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-subtle);
    }

    /* 6 CAPABILITIES MODULES */
    .section-editorial {
      padding: 96px 0;
      border-bottom: 1px solid var(--border-hairline);
    }
    .section-pretitle {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-subtle);
      margin-bottom: 14px;
      display: block;
    }
    .section-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 3.5vw, 2.75rem);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 20px;
    }
    .section-desc {
      font-size: 16px;
      color: var(--text-muted);
      max-width: 640px;
      margin-bottom: 56px;
    }

    .capabilities-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .cap-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
    }
    .cap-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.05);
    }
    .cap-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .cap-index-tag {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent-clay);
    }
    .cap-status-pill {
      font-family: var(--font-mono);
      font-size: 10.5px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-canvas-subtle);
      color: var(--text-muted);
    }
    .cap-card h3 {
      font-family: var(--font-sans);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .cap-card p {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .cap-artifact-box {
      background: #fafaf8;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      margin-bottom: 20px;
    }
    .cap-footer-meta {
      border-top: 1px solid var(--border-hairline);
      padding-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-subtle);
    }

    .wave-bars span {
      display: inline-block;
      width: 3px;
      background: var(--accent-clay);
      border-radius: 2px;
      margin: 0 1px;
      animation: soundBars 1.2s ease-in-out infinite alternate;
    }
    .wave-bars span:nth-child(1) { height: 6px; animation-delay: 0.1s; }
    .wave-bars span:nth-child(2) { height: 14px; animation-delay: 0.3s; }
    .wave-bars span:nth-child(3) { height: 9px; animation-delay: 0.2s; }
    .wave-bars span:nth-child(4) { height: 18px; animation-delay: 0.5s; }
    .wave-bars span:nth-child(5) { height: 12px; animation-delay: 0.15s; }
    .wave-bars span:nth-child(6) { height: 7px; animation-delay: 0.4s; }
    @keyframes soundBars {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1.3); }
    }

    /* DARK TERMINAL SECTION */
    .section-dark {
      background: var(--bg-dark);
      color: var(--text-dark-main);
      padding: 104px 0;
      border-top: 1px solid #262624;
      border-bottom: 1px solid #262624;
    }
    .dark-header {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 52px;
    }
    .dark-header .section-pretitle {
      color: var(--accent-clay);
    }
    .dark-header .section-title {
      color: var(--text-dark-main);
    }
    .dark-header .section-desc {
      color: var(--text-dark-muted);
      margin: 0 auto;
    }

    /* Fixed Terminal Window */
    .terminal-window-root {
      max-width: 960px;
      margin: 0 auto;
      border: 1px solid var(--bg-dark-border);
      border-radius: var(--radius-lg);
      background: var(--bg-dark-surface);
      overflow: hidden;
      box-shadow: 0 28px 72px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
    .term-system-bar {
      background: #151514;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .term-os-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .os-tab-pill {
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-dark-subtle);
      font-family: var(--font-mono);
      font-size: 11.5px;
      padding: 4px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }
    .os-tab-pill:hover {
      color: var(--text-dark-main);
    }
    .os-tab-pill.active {
      color: #ffffff;
      background: #252523;
      border-color: rgba(255, 255, 255, 0.12);
    }
    .term-playback-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-term-action {
      background: #232321;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      color: #d1cfc7;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition);
    }
    .btn-term-action:hover {
      background: #2f2f2c;
      color: #ffffff;
    }

    /* OS Window Chromes */
    .chrome-mac {
      background: #1c1c1a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      height: 38px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .mac-lights {
      display: flex;
      gap: 7px;
    }
    .mac-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .mac-dot.close { background: #ff5f56; }
    .mac-dot.min { background: #ffbd2e; }
    .mac-dot.max { background: #27c93f; }
    .mac-title-text {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dark-muted);
    }

    .chrome-win {
      background: #181816;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      height: 38px;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding-left: 10px;
    }
    .win-tab-active {
      background: var(--bg-dark-surface);
      border-top: 2px solid var(--accent-clay);
      height: 100%;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: #ffffff;
    }
    .win-window-controls {
      display: flex;
    }
    .win-btn {
      width: 44px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dark-subtle);
      font-size: 11px;
    }

    .chrome-termux-touchbar {
      background: #121211;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      overflow-x: auto;
    }
    .termux-key-chip {
      background: #222220;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      color: var(--text-dark-muted);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
    }

    /* LOCKED VIEWPORT // EXACT 1:1 INV.PY MONOSPACE TEXT GRID */
    .term-screen-viewport {
      padding: 12px 16px;
      height: 520px;
      min-height: 520px;
      max-height: 520px;
      box-sizing: border-box;
      font-family: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0;
      font-size: 11.2px;
      line-height: 14.2px;
      white-space: pre;
      letter-spacing: 0;
      color: #e0ded6;
      background: #101416;
      border-top: 1px solid #1f3037;
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      user-select: text;
      -webkit-user-select: text;
    }
    .term-screen-viewport::-webkit-scrollbar {
      height: 4px;
    }
    .term-screen-viewport::-webkit-scrollbar-thumb {
      background: #366572;
      border-radius: 2px;
    }

    .t-row {
      height: 14.2px;
      line-height: 14.2px;
      white-space: pre;
      font-family: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0;
      letter-spacing: 0;
      margin: 0;
      padding: 0;
      user-select: text;
    }

    /* Terminal Color Palette (Matched 1:1 to inv.py and Screenshot) */
    .tb-bdr { color: #366572; }        /* Outer borders: slate cyan */
    .mb-bdr { color: #366572; }        /* Matrix box borders: slate cyan */
    .t-ok { color: #9aa567; font-weight: 600; }  /* Olive green status */
    .t-gold { color: #d4a34b; }        /* Amber tags */
    .t-cyan { color: #4a9fb0; }        /* Prompt cyan */
    .t-white { color: #ffffff; }       /* White text */
    .t-dim { color: #6e7d82; }         /* Dim text */

    /* RIGID MONOSPACE MATRIX RAIN GRID (LOCKED 36ch CONTAINER & 18 DISCRETE 2ch CELLS) */
    .m-stream-row {
      display: inline-flex !important;
      width: 36ch !important;
      min-width: 36ch !important;
      max-width: 36ch !important;
      height: 14.2px !important;
      line-height: 14.2px !important;
      overflow: hidden !important;
      vertical-align: top !important;
      letter-spacing: 0 !important;
    }
    .m-cell {
      display: inline-block !important;
      width: 2ch !important;
      min-width: 2ch !important;
      max-width: 2ch !important;
      height: 14.2px !important;
      line-height: 14.2px !important;
      overflow: hidden !important;
      text-align: left !important;
      flex-shrink: 0 !important;
      white-space: pre !important;
      box-sizing: border-box !important;
      letter-spacing: 0 !important;
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Hiragino Kaku Gothic ProN', Meiryo, monospace !important;
    }

    /* Clickable Terminal Menu Options */
    .term-menu-choice {
      color: #9da5a8;
      cursor: pointer;
      display: inline-block;
      transition: all 0.08s ease;
      user-select: text;
    }
    .term-menu-choice:hover {
      color: #ffffff !important;
      background: rgba(166, 226, 46, 0.15);
      border-radius: 2px;
    }
    .term-menu-choice.active {
      color: #a6e22e !important;
      font-weight: 700;
      text-shadow: 0 0 7px rgba(166, 226, 46, 0.55);
    }

    /* Interactive Prompt & Dynamic Console Output */
    .term-cli-prompt {
      margin-top: 6px;
      font-family: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
      font-size: 11.2px;
      line-height: 15px;
      white-space: pre;
      color: #e0ded6;
    }
    .term-cli-output {
      margin-top: 4px;
      font-family: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
      font-size: 10.5px;
      line-height: 1.38;
      color: #9aa567;
      white-space: pre-wrap;
      border-left: 2px solid #366572;
      padding-left: 8px;
      min-height: 52px;
    }

    .cursor-block {
      display: inline-block;
      width: 7px;
      height: 13px;
      vertical-align: -2px;
      background: #ffffff;
      animation: cursorBlink 0.85s infinite;
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* Dynamic Action Terminal Output Strip */
    .term-action-badge-row {
      margin-top: 10px;
      background: #101416;
      border: 1px solid #233b43;
      border-radius: 4px;
      padding: 8px 12px;
      font-size: 11.5px;
      color: #eae9e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .term-bottom-info {
      background: #171715;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dark-subtle);
    }

    /* PRICING PASSES SECTION */
    .section-pricing {
      padding: 96px 0;
      border-bottom: 1px solid var(--border-hairline);
      background: var(--bg-canvas);
    }
    .pricing-split-layout {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 40px;
      align-items: start;
    }
    .plans-container {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 32px;
    }
    .plans-container-header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .plan-stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .plan-row {
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      background: #fafaf8;
      transition: var(--transition);
    }
    .plan-row:hover {
      border-color: var(--border-strong);
      background: #ffffff;
      transform: translateY(-1px);
    }
    .plan-row.active {
      border-color: var(--text-main);
      background: #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }
    .plan-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .plan-radio {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      transition: var(--transition);
    }
    .plan-row.active .plan-radio {
      border-color: var(--text-main);
      background: var(--text-main);
    }
    .plan-radio::after {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      display: none;
    }
    .plan-row.active .plan-radio::after {
      display: block;
    }
    .plan-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .plan-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
    }
    .badge-pop { background: var(--accent-clay-subtle); color: var(--accent-clay); }
    .badge-best { background: var(--accent-olive-subtle); color: var(--accent-olive); }
    .plan-desc { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
    .plan-cost { font-family: var(--font-mono); font-size: 17px; font-weight: 600; color: var(--text-main); }

    /* Payment Console */
    .checkout-console {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 32px;
    }
    .checkout-tabs-bar {
      display: flex;
      border-bottom: 1px solid var(--border-hairline);
      margin-bottom: 24px;
    }
    .checkout-tab {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      border-bottom: 2px solid transparent;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }
    .checkout-tab:hover { color: var(--text-main); }
    .checkout-tab.active {
      color: var(--text-main);
      font-weight: 600;
      border-bottom-color: var(--accent-clay);
    }

    .btn-direct-checkout {
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      font-size: 14.5px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      transition: var(--transition);
    }
    .btn-upi-action { background: #141413; color: #ffffff; }
    .btn-upi-action:hover { background: #000000; transform: translateY(-1px); }
    .btn-ton-action { background: #0088cc; color: #ffffff; }
    .btn-ton-action:hover { background: #0077b3; transform: translateY(-1px); }

    .qr-box-frame {
      background: #fafaf8;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .qr-box-frame img {
      width: 190px;
      height: 190px;
      display: block;
      margin: 0 auto 10px;
      border-radius: var(--radius-sm);
      background: #ffffff;
    }
    .qr-note { font-size: 12px; color: var(--text-muted); }

    .meta-data-strip {
      background: #fafaf8;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    .meta-data-label {
      color: var(--text-subtle);
      font-family: var(--font-mono);
      font-size: 11.5px;
      text-transform: uppercase;
    }
    .meta-data-val {
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-chip-copy {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 2px 8px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      cursor: pointer;
      color: var(--text-main);
      transition: var(--transition);
    }
    .btn-chip-copy:hover { background: var(--text-main); color: #ffffff; }

    .input-field-wrap { margin-top: 18px; }
    .input-field-wrap label {
      display: block;
      font-size: 12px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-subtle);
      margin-bottom: 8px;
    }
    .input-mono {
      width: 100%;
      background: #fafaf8;
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease;
      margin-bottom: 12px;
    }
    .input-mono:focus { border-color: var(--text-main); background: #ffffff; }
    .btn-submit-action {
      width: 100%;
      background: var(--accent-clay);
      border: 1px solid var(--accent-clay);
      border-radius: var(--radius-md);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      padding: 13px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: var(--transition);
    }
    .btn-submit-action:hover { background: var(--accent-clay-hover); }
    .btn-submit-action:disabled {
      opacity: 0.88;
      cursor: not-allowed;
      transform: none !important;
    }
    .btn-submit-action.submitting {
      background: #4a4843 !important;
      border-color: #4a4843 !important;
    }
    .btn-submit-action.success-state {
      background: #235438 !important;
      border-color: #235438 !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(35, 84, 56, 0.28);
    }
    .btn-spinner {
      width: 15px;
      height: 15px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: btn-spin 0.7s linear infinite;
      display: inline-block;
      flex-shrink: 0;
    }
    @keyframes btn-spin {
      to { transform: rotate(360deg); }
    }
    .utr-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .utr-counter-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      background: var(--bg-canvas-subtle);
      border: 1px solid var(--border-hairline);
      color: var(--text-muted);
      transition: all 0.2s ease;
      font-weight: 500;
    }
    .utr-counter-badge.ready {
      background: rgba(46, 105, 69, 0.12);
      border-color: rgba(46, 105, 69, 0.4);
      color: #235438;
      font-weight: 700;
    }
    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #235438;
      box-shadow: 0 0 0 0 rgba(35, 84, 56, 0.7);
      animation: pulse-ring 1.8s infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(35, 84, 56, 0.7); }
      70% { box-shadow: 0 0 0 7px rgba(35, 84, 56, 0); }
      100% { box-shadow: 0 0 0 0 rgba(35, 84, 56, 0); }
    }
    .confirmation-card {
      background: #ffffff;
      border: 1.5px solid rgba(46, 105, 69, 0.35);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      text-align: left;
    }
    .confirmation-card-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 13.5px;
      color: #1e3b2b;
      margin-bottom: 8px;
    }
    .confirmation-card-body {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.55;
    }
    .confirmation-card-body code {
      font-family: var(--font-mono);
      font-weight: 700;
      background: var(--bg-canvas-subtle);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-main);
      border: 1px solid var(--border-hairline);
    }
    .confirmation-live-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-hairline);
      font-size: 12px;
      color: #235438;
      font-weight: 600;
    }

    .status-note {
      margin-top: 16px;
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }
    .status-note.pending { display: block; background: var(--accent-clay-subtle); border: 1px solid var(--accent-clay); color: var(--text-main); }
    .status-note.approved { display: block; background: var(--accent-olive-subtle); border: 1px solid var(--accent-olive); color: #1e3b2b; }
    .status-note.rejected { display: block; background: #fdf0ed; border: 1px solid #d9534f; color: #a02824; }

    /* KEY REVEAL MODAL */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 19, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-dialog {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 36px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.2);
    }
    .modal-key-display {
      background: #fafaf8;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-md);
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-all;
      margin-bottom: 16px;
    }

    .site-footer {
      background: var(--bg-canvas-subtle);
      border-top: 1px solid var(--border-hairline);
      padding: 64px 0 48px;
    }
    .footer-top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 36px;
      margin-bottom: 48px;
    }
    .footer-brand h4 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .footer-brand p { font-size: 13.5px; color: var(--text-muted); max-width: 320px; }
    .footer-links-group { display: flex; gap: 48px; }
    .footer-col h5 {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-subtle);
      margin-bottom: 14px;
    }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .footer-col a { font-size: 13.5px; color: var(--text-muted); text-decoration: none; }
    .footer-col a:hover { color: var(--text-main); }
    .footer-bottom {
      border-top: 1px solid var(--border-hairline);
      padding-top: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-subtle);
    }

    .support-pill {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 800;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-pill);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      transition: var(--transition);
    }

    /* =========================================================
       MOBILE HAMBURGER NAVIGATION & DRAWER
       ========================================================= */
    .mobile-menu-toggle {
      display: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-hairline);
      border-radius: 6px;
      width: 38px;
      height: 38px;
      padding: 9px;
      cursor: pointer;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s ease, border-color 0.15s ease;
      z-index: 10002;
    }
    .mobile-menu-toggle:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent-clay);
    }
    .ham-line {
      display: block;
      width: 100%;
      height: 2px;
      background: var(--text-main);
      border-radius: 2px;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
      transform-origin: center;
    }
    .mobile-menu-toggle.is-active .ham-line:nth-child(1) {
      transform: translateY(8px) rotate(45deg);
    }
    .mobile-menu-toggle.is-active .ham-line:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }
    .mobile-menu-toggle.is-active .ham-line:nth-child(3) {
      transform: translateY(-8px) rotate(-45deg);
    }

    .mobile-menu-drawer {
      display: none;
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      background: rgba(18, 18, 17, 0.98);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 20px 24px 28px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
      transform: translateY(-110%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10001;
    }
    .mobile-menu-drawer.is-open {
      transform: translateY(0);
    }

    .mobile-nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 20px;
    }
    .mobile-nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      border-radius: 8px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .mobile-nav-item:hover, .mobile-nav-item:active {
      background: rgba(255, 255, 255, 0.06);
      color: var(--accent-clay);
    }
    .m-nav-num {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-subtle);
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .mobile-support-link {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding: 10px 14px;
      background: rgba(217, 119, 87, 0.08);
      border: 1px solid rgba(217, 119, 87, 0.2);
      border-radius: 8px;
      color: var(--accent-clay);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
    }

    .mobile-menu-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 10000;
    }
    .mobile-menu-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    /* =========================================================
       DEDICATED QUICK INSTALL COMMAND STRIP (BEFORE CORE MODULES)
       ========================================================= */
    .quick-run-wrap {
      padding: 0 0 64px 0;
      position: relative;
    }
    .quick-run-card {
      background: #151718;
      border: 1px solid #28373d;
      border-radius: 12px;
      padding: 24px 28px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
    }
    .quick-run-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-clay), #55a832, transparent);
    }
    .qr-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .qr-label-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .qr-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(217, 119, 87, 0.12);
      border: 1px solid rgba(217, 119, 87, 0.28);
      color: var(--accent-clay);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 4px;
    }
    .qr-pip {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-clay);
      box-shadow: 0 0 6px var(--accent-clay);
    }
    .qr-meta {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-dark-subtle);
    }
    .qr-os-toggles {
      display: inline-flex;
      background: #0d1011;
      border: 1px solid #233036;
      border-radius: 6px;
      padding: 3px;
      gap: 2px;
    }
    .qr-os-btn {
      background: transparent;
      border: none;
      color: #7f8f94;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .qr-os-btn:hover {
      color: #ffffff;
    }
    .qr-os-btn.active {
      background: #233036;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    }
    .qr-command-bar {
      display: flex;
      align-items: center;
      background: #0b0e0f;
      border: 1px solid #28373d;
      border-radius: 8px;
      padding: 10px 14px;
      gap: 12px;
      margin-bottom: 16px;
      position: relative;
    }
    .qr-prefix-tag {
      font-family: var(--font-mono);
      font-size: 13px;
      color: #55a832;
      font-weight: 700;
      user-select: none;
    }
    .qr-cmd-text {
      flex: 1;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #e6e4dc;
      white-space: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      line-height: 1.4;
      letter-spacing: 0;
      padding: 2px 0;
    }
    .qr-cmd-text::-webkit-scrollbar {
      height: 3px;
    }
    .qr-cmd-text::-webkit-scrollbar-thumb {
      background: #28373d;
      border-radius: 2px;
    }
    .qr-copy-btn {
      background: var(--accent-clay);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
