<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRONOS — Intelligent Privacy Architecture for Telegram (OPTION1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-canvas: #faf9f5;
      --bg-canvas-subtle: #f3f1ea;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #ffffff;
      
      --bg-dark: #141413;
      --bg-dark-surface: #191918;
      --bg-dark-border: rgba(255, 255, 255, 0.12);
      
      --border-hairline: #e8e6dc;
      --border-strong: #d0cebf;
      
      --text-main: #141413;
      --text-muted: #5e5d59;
      --text-subtle: #8a8880;
      
      --text-dark-main: #faf9f5;
      --text-dark-muted: #a3a199;
      --text-dark-subtle: #75746e;
      
      --accent-clay: #d97757;
      --accent-clay-hover: #c46545;
      --accent-clay-subtle: rgba(217, 119, 87, 0.12);
      --accent-olive: #788c5d;
      --accent-olive-subtle: rgba(120, 140, 93, 0.14);
      --accent-cyan: #4dd0e1;
      
      --font-serif: 'Newsreader', Georgia, Cambria, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', SFMono-Regular, Consolas, monospace;
      
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 9999px;
      
      --container-max: 1220px;
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; -webkit-font-smoothing: antialiased; }
    
    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      overflow-x: hidden;
    }

    svg.icon {
      width: 16px;
      height: 16px;
      vertical-align: -2px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 28px;
    }

    /* NAVIGATION BAR */
    .site-nav-wrap {
      position: sticky;
      top: 0;
      z-index: 900;
      background: rgba(250, 249, 245, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-hairline);
    }
    .site-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    /* BRANDMARK STYLING (UN-COPIABLE VECTOR TYPOGRAPHY) */
    /* BRANDMARK STYLING: OPTION 1 (ROLLING & EATING CLAY O) */
    .brand-mark-interactive {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      cursor: pointer;
    }
    .brand-mark-interactive span.dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-clay);
      display: inline-block;
      margin-right: 10px;
    }
    .brand-stage {
      display: inline-block;
      overflow: visible;
      transition: max-width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .brand-svg-mark {
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      pointer-events: none;
      overflow: visible;
      vertical-align: middle;
      display: block;
    }
    .svg-glyph-fixed {
      font-family: var(--font-sans);
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: 0.12em;
      fill: var(--text-main);
    }
    .svg-glyph-eaten {
      font-family: var(--font-sans);
      font-size: 16.5px;
      font-weight: 800;
      letter-spacing: 0.12em;
      fill: var(--text-main);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }


    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .nav-links a {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .nav-links a:hover {
      color: var(--text-main);
    }
    .nav-support-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
    }
    .nav-support-badge .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-olive);
      box-shadow: 0 0 0 3px var(--accent-olive-subtle);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .btn-nav-cta {
      background: var(--text-main);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: var(--radius-md);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      border: 1px solid var(--text-main);
    }
    .btn-nav-cta:hover {
      background: #000000;
      transform: translateY(-1px);
    }

    /* HERO SECTION */
    .hero-wrap {
      padding: 96px 0 72px;
      border-bottom: 1px solid var(--border-hairline);
    }
    .hero-category-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-clay);
      background: var(--accent-clay-subtle);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      margin-bottom: 28px;
    }
    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(2.75rem, 5.5vw, 4.5rem);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.025em;
      color: var(--text-main);
      max-width: 980px;
      margin-bottom: 28px;
    }
    .hero-title em {
      font-style: italic;
      color: var(--text-main);
    }
    .hero-lead {
      font-size: clamp(1.125rem, 2vw, 1.25rem);
      font-weight: 400;
      line-height: 1.6;
      color: var(--text-muted);
      max-width: 740px;
      margin-bottom: 40px;
    }
    .hero-cta-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin-bottom: 56px;
    }
    .btn-primary-clay {
      background: var(--accent-clay);
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      border: 1px solid var(--accent-clay);
    }
    .btn-primary-clay:hover {
      background: var(--accent-clay-hover);
      transform: translateY(-1px);
    }
    .btn-outline-minimal {
      background: transparent;
      color: var(--text-main);
      font-size: 14.5px;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border-strong);
      transition: var(--transition);
    }
    .btn-outline-minimal:hover {
      border-color: var(--text-main);
      background: #ffffff;
    }

    /* Telemetry Metric Strip */
    .metric-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--border-hairline);
      padding-top: 36px;
    }
    .metric-col {
      padding: 0 20px 0 0;
      border-right: 1px solid var(--border-hairline);
    }
    .metric-col:last-child {
      border-right: none;
      padding-right: 0;
    }
    .metric-num {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 500;
      color: var(--text-main);
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .metric-label {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-subtle);
    }

    /* 6 CAPABILITIES MODULES */
    .section-editorial {
      padding: 96px 0;
      border-bottom: 1px solid var(--border-hairline);
    }
    .section-pretitle {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-subtle);
      margin-bottom: 14px;
      display: block;
    }
    .section-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 3.5vw, 2.75rem);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 20px;
    }
    .section-desc {
      font-size: 16px;
      color: var(--text-muted);
      max-width: 640px;
      margin-bottom: 56px;
    }

    .capabilities-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .cap-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
    }
    .cap-card:hover {
      border-color: var(--border-strong);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.05);
    }
    .cap-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .cap-index-tag {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--accent-clay);
    }
    .cap-status-pill {
      font-family: var(--font-mono);
      font-size: 10.5px;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-canvas-subtle);
      color: var(--text-muted);
    }
    .cap-card h3 {
      font-family: var(--font-sans);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
